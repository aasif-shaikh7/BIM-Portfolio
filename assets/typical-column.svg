    <text x="130" y="424" font-size="12" fill="#3a2440" text-anchor="middle">400×400</text>

    <text x="415" y="120" font-size="12" fill="#8f7a89" text-anchor="middle">ELEVATION</text>
    <text x="378" y="64" font-size="11" fill="#3a2440">8 nos. 20ϕ long. bars</text>
    <text x="466" y="150" font-size="11" fill="#8f7a89">10ϕ ties</text>
    <text x="466" y="166" font-size="11" fill="#8f7a89">@150 c/c</text>
    <rect x="370" y="90" width="90" height="350" fill="none" stroke="#3a2440" stroke-width="2"/>
    <g stroke="#a04e88" stroke-width="2.5">
      <line x1="378" y1="90" x2="378" y2="492"/>
      <line x1="392" y1="90" x2="392" y2="492"/>
      <line x1="438" y1="90" x2="438" y2="492"/>
      <line x1="452" y1="90" x2="452" y2="492"/>
    </g>
    <g stroke="#3a2440" stroke-width="1.6">
