<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <rect width="640" height="480" fill="#f4eee6"/>
  <g font-family="Consolas,monospace">
    <defs>
      <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#8f7a89"/></marker>
    </defs>
    <text x="24" y="34" font-size="15" font-weight="700" fill="#3a2440">TYPICAL COLUMN DETAIL — CROSS-SECTION + ELEVATION</text>
    <text x="616" y="34" font-size="11" fill="#8f7a89" text-anchor="end">NOT TO SCALE</text>

    <text x="130" y="120" font-size="12" fill="#8f7a89" text-anchor="middle">CROSS-SECTION</text>
    <rect x="30" y="190" width="200" height="200" fill="none" stroke="#3a2440" stroke-width="2"/>
    <rect x="55" y="215" width="150" height="150" fill="none" stroke="#a04e88" stroke-width="1.5" stroke-dasharray="8 4"/>
    <g fill="#a04e88">
      <circle cx="50" cy="210" r="5"/><circle cx="210" cy="210" r="5"/>
      <circle cx="50" cy="370" r="5"/><circle cx="210" cy="370" r="5"/>
      <circle cx="130" cy="210" r="5"/><circle cx="130" cy="370" r="5"/>
      <circle cx="50" cy="290" r="5"/><circle cx="210" cy="290" r="5"/>
    </g>
    <text x="30" y="170" font-size="12" fill="#3a2440">8 nos. 20ϕ bars</text>
    <line x1="232" y1="288" x2="246" y2="300" stroke="#8f7a89"/>
    <text x="250" y="306" font-size="11" fill="#8f7a89">cover 40mm</text>
