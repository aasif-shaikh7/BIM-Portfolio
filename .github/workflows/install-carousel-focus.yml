name: Install focused project carousel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load focus carousel script
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          tag = '<script src="carousel-focus.js"></script>'

          if 'carousel-focus.js' not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Cannot find </body> in index.html')
              text = text.replace(marker, '  ' + tag + '\n' + marker, 1)
              index.write_text(text, encoding='utf-8')
          else:
              print('carousel-focus.js already linked.')

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/install-carousel-focus.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/install-carousel-focus.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "feat: highlight active project carousel card"
            git push
          fi
