name: Fix BBS counter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch BBS counter selectors
        shell: python
        run: |
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          updated = text.replace("root.querySelector('.bbs-current')", "root.querySelector('#bbs-current')")
          updated = updated.replace("root.querySelector('.bbs-total')", "root.querySelector('#bbs-total')")
          if updated != text:
              path.write_text(updated, encoding='utf-8')
          else:
              print('BBS counter selectors already fixed.')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "fix: update BBS counter selectors"
            git push
          fi
